[project]
name = "cse-analyzer"
version = "0.1.0"
description = "CSE swing-trading analyzer: daily EOD collection, scoring and reports"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cse = "cse_analyzer.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
